[package]
name = "rn_material_symbols_scanner"
version = "0.2.0"
edition = "2021"
license = "Apache-2.0"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
napi = "3"
napi-derive = "3"
oxc_allocator = "=0.146.0"
oxc_ast = "=0.146.0"
oxc_ast_visit = "=0.146.0"
oxc_parser = "=0.146.0"
oxc_semantic = "=0.146.0"
oxc_span = "=0.146.0"
oxc_syntax = "=0.146.0"
rayon = "1"
regex = "1"
stacker = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }

[build-dependencies]
napi-build = "2"

[profile.release]
lto = true
codegen-units = 1
